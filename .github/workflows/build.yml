name: Build ncnn_mobileclip Vulkan for ARM64 Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout ncnn
        uses: actions/checkout@v4
        with:
          repository: Tencent/ncnn
          path: ncnn
          submodules: recursive

      - name: Checkout ncnn_mobileclip
        uses: actions/checkout@v4
        with:
          repository: hhxiaozhi/ncnn_mobileclip
          path: ncnn_mobileclip

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make libopencv-dev libvulkan-dev glslang-tools

      - name: Build ncnn (CPU only, no Vulkan)
        run: |
          cd ncnn
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DNCNN_VULKAN=OFF \
            -DNCNN_BUILD_TOOLS=ON \
            -DNCNN_BUILD_EXAMPLES=OFF \
            -DNCNN_BUILD_BENCHMARK=OFF
          make -j4
          sudo make install
          sudo ldconfig

      - name: Build ncnn_mobileclip
        run: |
          cd ncnn_mobileclip/ncnn_mobileclip_infer
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -Dncnn_DIR=/usr/local/lib/cmake/ncnn
          make -j4

      - name: Collect artifacts
        run: |
          mkdir -p output
          cp ncnn_mobileclip/ncnn_mobileclip_infer/build/ncnn_mobileclip_vulkan output/ 2>/dev/null || true
          cp ncnn_mobileclip/ncnn_mobileclip_infer/build/preprocess.spv output/ 2>/dev/null || true
          cp /usr/local/lib/libncnn* output/ 2>/dev/null || true
          ls -lh output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ncnn_vulkan_arm64
          path: output/
