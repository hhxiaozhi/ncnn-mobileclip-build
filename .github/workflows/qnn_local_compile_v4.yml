name: Compile MobileCLIP to QNN (Local QAIRT fp16 v4)

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python deps for converter
        run: |
          python -m pip install --upgrade pip
          pip install numpy onnx onnxruntime onnxsim

      - name: Download QAIRT SDK 2.31
        run: |
          QAIRT_VERSION="2.31.0.250130"
          URL="https://softwarecenter.qualcomm.com/api/download/software/qualcomm_neural_processing_sdk/v${QAIRT_VERSION}.zip"
          wget -q --show-progress "$URL" -O qairt.zip
          ls -lh qairt.zip
          unzip -q qairt.zip -d qairt_extracted
          ls qairt_extracted/qairt/2.31.0.250130/

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          ls -d android-ndk-r25c

      - name: Download ONNX Model
        run: |
          wget -q https://github.com/hhxiaozhi/ncnn-mobileclip-build/releases/download/v1.0-model/mobileclip_image.onnx
          ls -lh mobileclip_image.onnx

      - name: Setup env
        run: |
          echo "QNN_SDK_ROOT=$(pwd)/qairt_extracted/qairt/2.31.0.250130" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$(pwd)/android-ndk-r25c" >> $GITHUB_ENV

      - name: Step 1 - ONNX to C++ (fp16)
        run: |
          set -o pipefail
          source $QNN_SDK_ROOT/bin/envsetup.sh
          mkdir -p out
          qnn-onnx-converter \
            --input_network mobileclip_image.onnx \
            --input_dim pixel_values 1,3,224,224 \
            --act_bias_bitwidth 16 --act_bitwidth 16 \
            --weight_bias_bitwidth 16 --weight_bitwidth 16 \
            --output_path out/mobileclip_model.cpp \
            2>&1 | tee out/step1_convert.log
          echo "=== 转换产物 ==="
          ls -lh out/

      - name: Step 2 - Generate model library (.so)
        run: |
          set -o pipefail
          source $QNN_SDK_ROOT/bin/envsetup.sh
          mkdir -p out/lib
          qnn-model-lib-generator \
            -c out/mobileclip_model.cpp \
            -b out/mobileclip_model.bin \
            -o out/lib \
            --target aarch64-android \
            2>&1 | tee out/step2_lib.log
          echo "=== so 产物 ==="
          ls -lh out/lib/
          file out/lib/*.so || true

      - name: Step 3 - Generate context binary (v68)
        run: |
          set -o pipefail
          source $QNN_SDK_ROOT/bin/envsetup.sh
          SO_FILE=$(ls out/lib/lib*.so | head -1)
          echo "输入 so: $SO_FILE"
          mkdir -p out/context
          # 首次尝试：默认 config
          qnn-context-binary-generator \
            --backend $QNN_SDK_ROOT/lib/x86_64-linux-clang/libQnnHtp.so \
            --model "$SO_FILE" \
            --output_dir out/context \
            --binary_file mobileclip_fp16_v68.bin \
            2>&1 | tee out/step3_context.log || true
          echo "=== context binary 产物 ==="
          ls -lhR out/context/ 2>/dev/null || echo "无产物，看 step3_context.log"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qnn-fp16-v68-result
          path: |
            out/context/**/*.bin
            out/lib/**/*.so
            out/*.log
            out/mobileclip_model.*
          if-no-files-found: warn
