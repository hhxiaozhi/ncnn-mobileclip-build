name: Compile SigLIP2 So400M to QNN (fp16, HTP v68)

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install QAIRT Python deps
        run: |
          python -m pip install --upgrade pip
          pip install \
            "numpy<2.0" "onnx==1.14.1" "protobuf>=3.20,<4.0" "packaging>=20,<24" \
            pyyaml pillow pandas matplotlib scipy tqdm attrs six networkx sympy \
            "scikit-learn<1.6" opencv-python-headless onnxruntime

      - name: Download QAIRT SDK 2.31
        run: |
          wget -q "https://softwarecenter.qualcomm.com/api/download/software/qualcomm_neural_processing_sdk/v2.31.0.250130.zip" -O qairt.zip
          unzip -q qairt.zip -d qairt_extracted
          echo "QNN_SDK_ROOT=$(pwd)/qairt_extracted/qairt/2.31.0.250130" >> $GITHUB_ENV

      - name: Download SigLIP2 So400M fp16 ONNX from HuggingFace
        run: |
          wget -q --show-progress -O siglip2_so400m_fp16.onnx \
            'https://huggingface.co/onnx-community/siglip2-so400m-patch14-384-ONNX/resolve/main/onnx/vision_model_fp16.onnx'
          ls -lh siglip2_so400m_fp16.onnx

      - name: Step 1 - ONNX to C++ (fp16)
        run: |
          set -o pipefail
          source $QNN_SDK_ROOT/bin/envsetup.sh
          mkdir -p out
          qnn-onnx-converter \
            --input_network siglip2_so400m_fp16.onnx \
            --input_dim pixel_values 1,3,384,384 \
            --float_bitwidth 16 \
            --output_path out/siglip2_model.cpp \
            2>&1 | tee out/step1_convert.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -ne 0 ]; then exit 1; fi

      - name: Step 2 - Generate x86_64 .so
        run: |
          set -o pipefail
          source $QNN_SDK_ROOT/bin/envsetup.sh
          mkdir -p out/lib_x86
          qnn-model-lib-generator \
            -c out/siglip2_model.cpp \
            -b out/siglip2_model.bin \
            -o out/lib_x86 \
            -t x86_64-linux-clang \
            2>&1 | tee out/step2_lib.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -ne 0 ]; then exit 1; fi
          echo "=== x86_64 so ==="
          find out/lib_x86 -type f

      - name: Step 3 - Generate context binary (v68)
        run: |
          source $QNN_SDK_ROOT/bin/envsetup.sh
          SO_FILE=$(find out/lib_x86 -name 'lib*.so' -type f 2>/dev/null | head -n 1)
          echo "so: $SO_FILE"
          ls -lh "$SO_FILE"
          file "$SO_FILE"
          mkdir -p out/context
          CTX_DIR="$(pwd)/out/context"
          qnn-context-binary-generator \
            --backend $QNN_SDK_ROOT/lib/x86_64-linux-clang/libQnnHtp.so \
            --model "$SO_FILE" \
            --output_dir "$CTX_DIR" \
            --binary_file siglip2_so400m_fp16_v68.bin \
            > out/step3_context.log 2>&1
          EXIT_CODE=$?
          echo "exit code: $EXIT_CODE"
          echo "=== step3 log ==="
          cat out/step3_context.log
          echo "=== output ==="
          find out/context -type f 2>/dev/null || true
          exit $EXIT_CODE

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siglip2-so400m-fp16-v68
          path: |
            out/**/*.bin
            out/**/*.so
            out/*.log
            out/siglip2_model.*
          if-no-files-found: warn
