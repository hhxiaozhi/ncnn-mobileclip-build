name: Compile MobileCLIP to QNN (Local QAIRT fp16 v5)

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ALL Python deps for converter
        run: |
          python -m pip install --upgrade pip
          # QAIRT qnn-onnx-converter 的完整依赖
          pip install numpy onnx onnxruntime onnxsim \
            pyyaml packaging pillow opencv-python-headless \
            tqdm attrs six scipy \
            prettytable pandas matplotlib \
            networkx

      - name: Download QAIRT SDK 2.31
        run: |
          QAIRT_VERSION="2.31.0.250130"
          URL="https://softwarecenter.qualcomm.com/api/download/software/qualcomm_neural_processing_sdk/v${QAIRT_VERSION}.zip"
          wget -q --show-progress "$URL" -O qairt.zip
          ls -lh qairt.zip
          unzip -q qairt.zip -d qairt_extracted

      - name: Find and install SDK's own requirements
        run: |
          QNN_SDK_ROOT=$(pwd)/qairt_extracted/qairt/2.31.0.250130
          echo "QNN_SDK_ROOT=$QNN_SDK_ROOT" >> $GITHUB_ENV
          # 找 SDK 自带的 requirements.txt
          echo "=== 查找 SDK 的 requirements ==="
          find $QNN_SDK_ROOT -name "requirements*.txt" 2>/dev/null | head -20
          # 如果有，装上
          for req in $(find $QNN_SDK_ROOT -name "requirements.txt" 2>/dev/null); do
            echo "装: $req"
            pip install -r "$req" 2>&1 | tail -5 || true
          done

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK_ROOT=$(pwd)/android-ndk-r25c" >> $GITHUB_ENV

      - name: Download ONNX Model
        run: |
          wget -q https://github.com/hhxiaozhi/ncnn-mobileclip-build/releases/download/v1.0-model/mobileclip_image.onnx
          ls -lh mobileclip_image.onnx

      - name: Verify converter works
        run: |
          source $QNN_SDK_ROOT/bin/envsetup.sh
          echo "=== qnn-onnx-converter --version ==="
          qnn-onnx-converter --version 2>&1 | head -20 || true
          echo "=== 试着 --help ==="
          qnn-onnx-converter --help 2>&1 | head -20 || true

      - name: Step 1 - ONNX to C++ (fp16)
        run: |
          set -o pipefail
          source $QNN_SDK_ROOT/bin/envsetup.sh
          mkdir -p out
          qnn-onnx-converter \
            --input_network mobileclip_image.onnx \
            --input_dim pixel_values 1,3,224,224 \
            --act_bias_bitwidth 16 --act_bitwidth 16 \
            --weight_bias_bitwidth 16 --weight_bitwidth 16 \
            --output_path out/mobileclip_model.cpp \
            2>&1 | tee out/step1_convert.log
          echo "=== 转换产物 ==="
          ls -lh out/

      - name: Step 2 - Generate model library (.so)
        run: |
          set -o pipefail
          source $QNN_SDK_ROOT/bin/envsetup.sh
          mkdir -p out/lib
          qnn-model-lib-generator \
            -c out/mobileclip_model.cpp \
            -b out/mobileclip_model.bin \
            -o out/lib \
            --target aarch64-android \
            2>&1 | tee out/step2_lib.log
          echo "=== so 产物 ==="
          ls -lh out/lib/
          file out/lib/*.so || true

      - name: Step 3 - Generate context binary (v68)
        run: |
          set -o pipefail
          source $QNN_SDK_ROOT/bin/envsetup.sh
          SO_FILE=$(ls out/lib/lib*.so | head -1)
          mkdir -p out/context
          qnn-context-binary-generator \
            --backend $QNN_SDK_ROOT/lib/x86_64-linux-clang/libQnnHtp.so \
            --model "$SO_FILE" \
            --output_dir out/context \
            --binary_file mobileclip_fp16_v68.bin \
            2>&1 | tee out/step3_context.log || true
          ls -lhR out/context/ 2>/dev/null || echo "无产物"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qnn-fp16-v68-result-v5
          path: |
            out/**/*.bin
            out/**/*.so
            out/*.log
            out/mobileclip_model.*
          if-no-files-found: warn
