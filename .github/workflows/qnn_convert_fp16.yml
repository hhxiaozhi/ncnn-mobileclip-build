name: Compile MobileCLIP to QNN (fp16)

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Deps
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: onnx onnxscript numpy
          pip install --upgrade qai-hub
      - name: Download Model
        run: |
          wget -q https://github.com/hhxiaozhi/ncnn-mobileclip-build/releases/download/v1.0-model/mobileclip_image.onnx
          ls -lh mobileclip_image.onnx
      - name: Configure qai-hub
        env:
          QAI_HUB_API_TOKEN: ${{ secrets.QAI_HUB_API_TOKEN }}
        run: |
          qai-hub configure --api_token $QAI_HUB_API_TOKEN
      - name: Compile + Link (fp16)
        run: |
          cat > run.py <<'PYEOF'
          import sys, traceback
          import qai_hub as hub

          device = hub.Device("Samsung Galaxy S21 (Family)")
          try:
              model = hub.upload_model("mobileclip_image.onnx")
              print(f"model uploaded: {model}", flush=True)

              # float16 不做 IO 量化，不需要 calibration_data
              compile_job = hub.submit_compile_job(
                  model=model,
                  device=device,
                  input_specs={"pixel_values": (1,3,224,224)},
                  options="--target_runtime qnn_dlc --quantize_full_type float16 --truncate_64bit_io",
                  name="mobileclip compile fp16",
              )
              print(f"compile job: {compile_job.job_id}", flush=True)
              compile_job.wait()
              st = compile_job.get_status()
              print(f"compile status: {st}", flush=True)
              if st != "SUCCESS":
                  sys.exit(1)

              link_job = hub.submit_link_job(
                  models=[compile_job.get_target_model()],
                  device=device,
                  options="",
                  name="mobileclip link fp16",
              )
              print(f"link job: {link_job.job_id}", flush=True)
              link_job.wait()
              st = link_job.get_status()
              print(f"link status: {st}", flush=True)
              if st != "SUCCESS":
                  sys.exit(1)

              link_job.download_target_model("mobileclip_qnn_fp16.bin")
              print("downloaded mobileclip_qnn_fp16.bin", flush=True)
          except Exception:
              traceback.print_exc()
              sys.exit(1)
          PYEOF
          python run.py
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mobileclip-qnn-fp16
          path: "*.bin"
          if-no-files-found: error
