name: Compile MobileCLIP to QNN (Local QAIRT fp16 v3)

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download QAIRT SDK 2.31
        run: |
          QAIRT_VERSION="2.31.0.250130"
          URL="https://softwarecenter.qualcomm.com/api/download/software/qualcomm_neural_processing_sdk/v${QAIRT_VERSION}.zip"
          wget -q --show-progress "$URL" -O qairt.zip
          ls -lh qairt.zip
          unzip -q qairt.zip -d qairt_extracted
          echo "=== 解压后目录 ==="
          find qairt_extracted -maxdepth 3 -type d | head -30

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          ls -d android-ndk-r25c

      - name: Download ONNX Model
        run: |
          wget -q https://github.com/hhxiaozhi/ncnn-mobileclip-build/releases/download/v1.0-model/mobileclip_image.onnx
          ls -lh mobileclip_image.onnx

      - name: Locate QNN SDK root
        id: find_sdk
        run: |
          for candidate in             "qairt_extracted/qairt/2.31.0.250130"             "qairt_extracted/2.31.0.250130"             "qairt_extracted"; do
            if [ -f "$candidate/bin/envsetup.sh" ]; then
              echo "QNN_SDK_ROOT=$(pwd)/$candidate" >> $GITHUB_OUTPUT
              echo "找到 SDK: $candidate"
              exit 0
            fi
          done
          find qairt_extracted -maxdepth 4 -name "envsetup.sh" -o -name "qnn-onnx-converter" | head -20
          exit 1

      - name: DIAGNOSTIC - 列出 SDK 结构
        env:
          QNN_SDK_ROOT: ${{ steps.find_sdk.outputs.QNN_SDK_ROOT }}
        run: |
          echo "QNN_SDK_ROOT=$QNN_SDK_ROOT"
          echo "=== bin/ 目录 ==="
          ls -la $QNN_SDK_ROOT/bin/x86_64-linux-clang/ | head -30
          echo "=== 找 qnn-onnx-converter ==="
          find $QNN_SDK_ROOT -name "qnn-onnx-converter*" 2>/dev/null
          echo "=== 找 Python 转换脚本 ==="
          find $QNN_SDK_ROOT -name "*.py" -path "*onnx*" 2>/dev/null | head -10
          echo "=== envsetup.sh 内容 ==="
          cat $QNN_SDK_ROOT/bin/envsetup.sh | head -50

      - name: DIAGNOSTIC - 转换器 --help
        env:
          QNN_SDK_ROOT: ${{ steps.find_sdk.outputs.QNN_SDK_ROOT }}
        run: |
          export PATH=$QNN_SDK_ROOT/bin/x86_64-linux-clang:$PATH
          export LD_LIBRARY_PATH=$QNN_SDK_ROOT/lib/x86_64-linux-clang:$LD_LIBRARY_PATH
          export PYTHONPATH=$QNN_SDK_ROOT/lib/python:$PYTHONPATH
          which qnn-onnx-converter || find $QNN_SDK_ROOT -name "qnn-onnx-converter" -type f
          qnn-onnx-converter --help 2>&1 | head -80 || true
          echo "=== 尝试 python3 直调 ==="
          python3 $QNN_SDK_ROOT/bin/x86_64-linux-clang/qnn-onnx-converter --help 2>&1 | head -40 || true

      - name: Step 1 - ONNX to C++ (fp16) - attempt
        env:
          QNN_SDK_ROOT: ${{ steps.find_sdk.outputs.QNN_SDK_ROOT }}
        run: |
          export PATH=$QNN_SDK_ROOT/bin/x86_64-linux-clang:$PATH
          export LD_LIBRARY_PATH=$QNN_SDK_ROOT/lib/x86_64-linux-clang:$LD_LIBRARY_PATH
          export PYTHONPATH=$QNN_SDK_ROOT/lib/python:$PYTHONPATH
          mkdir -p out
          # 先看帮助确认参数
          echo "=== 尝试 qnn-onnx-converter --help ==="
          qnn-onnx-converter --help 2>&1 | head -60 || true
          echo "=== 尝试转换 ==="
          qnn-onnx-converter \
            --input_network mobileclip_image.onnx \
            --input_dim pixel_values 1,3,224,224 \
            --act_bias_bitwidth 16 --act_bitwidth 16 --weight_bias_bitwidth 16 --weight_bitwidth 16 \
            --output_path out/mobileclip_model.cpp 2>&1 | tee out/convert.log
          echo "=== 转换产物 ==="
          ls -lh out/

      - name: Upload logs and intermediate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-logs
          path: |
            out/convert.log
            qairt_extracted/**/bin/envsetup.sh
          if-no-files-found: warn
