name: Compile MobileCLIP to QNN (INT8 with real calibration)

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Deps
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: onnx onnxscript numpy
          pip install --upgrade qai-hub
      - name: Download Model and Calibration Data
        run: |
          wget -q https://github.com/hhxiaozhi/ncnn-mobileclip-build/releases/download/v1.0-model/mobileclip_image.onnx
          wget -q https://github.com/hhxiaozhi/ncnn-mobileclip-build/releases/download/v1.1-calib/calib_data.npz
          ls -lh mobileclip_image.onnx calib_data.npz
      - name: Configure qai-hub
        env:
          QAI_HUB_API_TOKEN: ${{ secrets.QAI_HUB_API_TOKEN }}
        run: |
          qai-hub configure --api_token $QAI_HUB_API_TOKEN
      - name: Quantize + Compile + Link (INT8 with real data)
        run: |
          cat > run.py <<'PYEOF'
          import sys, traceback, os
          import numpy as np
          import qai_hub as hub

          device = hub.Device("Samsung Galaxy S21 (Family)")
          try:
              # 1. 上传 ONNX
              model = hub.upload_model("mobileclip_image.onnx")
              print(f"model uploaded: {model}", flush=True)

              # 2. 加载真实校准数据 (uint8 [0,255] -> float32 [0,1])
              data = np.load("calib_data.npz")
              pixel_values_uint8 = data["pixel_values"]
              pixel_values_float = pixel_values_uint8.astype(np.float32) / 255.0
              n = pixel_values_float.shape[0]
              print(f"calib shape: {pixel_values_float.shape}, range [{pixel_values_float.min():.4f}, {pixel_values_float.max():.4f}]", flush=True)

              calib = {"pixel_values": [pixel_values_float[i:i+1] for i in range(n)]}
              calib_ds = hub.upload_dataset(calib)
              print(f"calib dataset uploaded: {calib_ds}", flush=True)

              # 3. INT8 量化（weights + activations 都 INT8，用真实数据校准）
              quant_job = hub.submit_quantize_job(
                  model=model,
                  calibration_data=calib_ds,
                  weights_dtype=hub.QuantizeDtype.INT8,
                  activations_dtype=hub.QuantizeDtype.INT8,
                  name="mobileclip quantize int8 real calib",
              )
              print(f"quant job: {quant_job.job_id}", flush=True)
              quant_job.wait()
              st = quant_job.get_status()
              print(f"quant status: {st}", flush=True)
              if st != "SUCCESS":
                  print(f"quant failed: {quant_job.get_status().failure_reason if hasattr(quant_job.get_status(), 'failure_reason') else ''}", flush=True)
                  sys.exit(1)
              quant_model = quant_job.get_target_model()

              # 4. 编译（--quantize_io 让 I/O 也量化）
              compile_job = hub.submit_compile_job(
                  model=quant_model,
                  device=device,
                  input_specs={"pixel_values": (1,3,224,224)},
                  options="--target_runtime qnn_dlc --quantize_io --truncate_64bit_io",
                  name="mobileclip compile int8 real calib",
              )
              print(f"compile job: {compile_job.job_id}", flush=True)
              compile_job.wait()
              st = compile_job.get_status()
              print(f"compile status: {st}", flush=True)
              if st != "SUCCESS":
                  sys.exit(1)

              # 5. link
              link_job = hub.submit_link_job(
                  models=[compile_job.get_target_model()],
                  device=device,
                  options="",
                  name="mobileclip link int8 real calib",
              )
              print(f"link job: {link_job.job_id}", flush=True)
              link_job.wait()
              st = link_job.get_status()
              print(f"link status: {st}", flush=True)
              if st != "SUCCESS":
                  sys.exit(1)

              link_job.download_target_model("mobileclip_qnn_calibrated.bin")
              size_mb = os.path.getsize("mobileclip_qnn_calibrated.bin") / 1024 / 1024
              print(f"downloaded mobileclip_qnn_calibrated.bin ({size_mb:.1f} MB)", flush=True)
          except Exception:
              traceback.print_exc()
              sys.exit(1)
          PYEOF
          python run.py
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mobileclip-qnn-calibrated
          path: "*.bin"
          if-no-files-found: error
