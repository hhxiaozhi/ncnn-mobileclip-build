name: Compile MobileCLIP to QNN (v11 - full deps)

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ALL QAIRT Python deps
        run: |
          python -m pip install --upgrade pip
          pip install \
            "numpy<2.0" \
            "onnx==1.14.1" \
            "protobuf>=3.20,<4.0" \
            "packaging>=20,<24" \
            pyyaml pillow \
            pandas matplotlib scipy \
            tqdm attrs six networkx sympy \
            "scikit-learn<1.6" \
            opencv-python-headless \
            onnxruntime
          echo "=== pip list ==="
          pip list 2>&1 | grep -iE "onnx|numpy|protobuf|yaml|packaging|pillow|pandas|matplotlib|scipy|tqdm|attrs|six|networkx|sympy|sklearn|opencv"

      - name: Download QAIRT SDK 2.31
        run: |
          QAIRT_VERSION="2.31.0.250130"
          URL="https://softwarecenter.qualcomm.com/api/download/software/qualcomm_neural_processing_sdk/v${QAIRT_VERSION}.zip"
          wget -q "$URL" -O qairt.zip
          unzip -q qairt.zip -d qairt_extracted
          echo "QNN_SDK_ROOT=$(pwd)/qairt_extracted/qairt/2.31.0.250130" >> $GITHUB_ENV

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK_ROOT=$(pwd)/android-ndk-r25c" >> $GITHUB_ENV

      - name: Download ONNX Model
        run: |
          wget -q https://github.com/hhxiaozhi/ncnn-mobileclip-build/releases/download/v1.0-model/mobileclip_image.onnx
          ls -lh mobileclip_image.onnx

      - name: Verify imports before run
        run: |
          source $QNN_SDK_ROOT/bin/envsetup.sh
          python -c "import pandas, numpy, onnx, yaml, packaging, matplotlib, scipy, cv2, sklearn; print('all imports OK')" 2>&1

      - name: Step 1 - ONNX to C++ (fp16)
        run: |
          set -o pipefail
          source $QNN_SDK_ROOT/bin/envsetup.sh
          mkdir -p out
          qnn-onnx-converter \
            --input_network mobileclip_image.onnx \
            --input_dim pixel_values 1,3,224,224 \
            --act_bias_bitwidth 16 --act_bitwidth 16 \
            --weight_bias_bitwidth 16 --weight_bitwidth 16 \
            --output_path out/mobileclip_model.cpp \
            2>&1 | tee out/step1_convert.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "converter exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" -ne 0 ]; then exit 1; fi
          ls -lh out/

      - name: Step 2 - Generate model library (.so)
        run: |
          set -o pipefail
          source $QNN_SDK_ROOT/bin/envsetup.sh
          mkdir -p out/lib
          qnn-model-lib-generator \
            -c out/mobileclip_model.cpp \
            -b out/mobileclip_model.bin \
            -o out/lib \
            --target aarch64-android \
            2>&1 | tee out/step2_lib.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "model-lib-generator exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" -ne 0 ]; then exit 1; fi
          ls -lh out/lib/
          file out/lib/*.so || true

      - name: Step 3 - Generate context binary (v68)
        run: |
          set -o pipefail
          source $QNN_SDK_ROOT/bin/envsetup.sh
          SO_FILE=$(ls out/lib/lib*.so | head -1)
          echo "输入 so: $SO_FILE"
          mkdir -p out/context
          # 用示例 config（如果存在）
          CONFIG_OPT=""
          for cfg in $QNN_SDK_ROOT/examples/Models/context_binary_generator_configs/htp_config.json; do
            if [ -f "$cfg" ]; then CONFIG_OPT="--config_file $cfg"; fi
          done
          qnn-context-binary-generator \
            --backend $QNN_SDK_ROOT/lib/x86_64-linux-clang/libQnnHtp.so \
            --model "$SO_FILE" \
            --output_dir out/context \
            --binary_file mobileclip_fp16_v68.bin \
            $CONFIG_OPT \
            2>&1 | tee out/step3_context.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "context-binary-generator exit code: $EXIT_CODE"
          ls -lhR out/context/ 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qnn-fp16-v68-v11
          path: |
            out/**/*.bin
            out/**/*.so
            out/*.log
            out/mobileclip_model.*
          if-no-files-found: warn
