name: Compile MobileCLIP to QNN (Local QAIRT fp16 v2)

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download QAIRT SDK 2.31
        run: |
          QAIRT_VERSION="2.31.0.250130"
          URL="https://softwarecenter.qualcomm.com/api/download/software/qualcomm_neural_processing_sdk/v${QAIRT_VERSION}.zip"
          echo "下载: $URL"
          wget -q --show-progress "$URL" -O qairt.zip
          ls -lh qairt.zip
          unzip -q qairt.zip -d qairt_extracted
          echo "=== 解压后目录 ==="
          find qairt_extracted -maxdepth 3 -type d | head -20

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          ls -d android-ndk-r25c

      - name: Download ONNX Model
        run: |
          wget -q https://github.com/hhxiaozhi/ncnn-mobileclip-build/releases/download/v1.0-model/mobileclip_image.onnx
          ls -lh mobileclip_image.onnx

      - name: Locate QNN SDK root
        id: find_sdk
        run: |
          # 解压后可能的结构: qairt_extracted/qairt/2.31.0.250130 或 qairt_extracted/2.31.0.250130
          for candidate in             "qairt_extracted/qairt/2.31.0.250130"             "qairt_extracted/2.31.0.250130"             "qairt_extracted"; do
            if [ -f "$candidate/bin/envsetup.sh" ]; then
              echo "QNN_SDK_ROOT=$(pwd)/$candidate" >> $GITHUB_OUTPUT
              echo "找到 SDK: $candidate"
              exit 0
            fi
          done
          echo "找不到 envsetup.sh，列出结构："
          find qairt_extracted -maxdepth 4 -name "envsetup.sh" -o -name "qnn-onnx-converter" | head -20
          exit 1

      - name: Step 1 - ONNX to C++ (fp16)
        env:
          QNN_SDK_ROOT: ${{ steps.find_sdk.outputs.QNN_SDK_ROOT }}
        run: |
          export PATH=$QNN_SDK_ROOT/bin/x86_64-linux-clang:$PATH
          export LD_LIBRARY_PATH=$QNN_SDK_ROOT/lib/x86_64-linux-clang:$LD_LIBRARY_PATH
          mkdir -p out
          qnn-onnx-converter \
            --input_network mobileclip_image.onnx \
            --input_dim pixel_values 1,3,224,224 \
            --float_bitwidth 16 \
            --output_path out/mobileclip_model.cpp
          echo "=== 转换产物 ==="
          ls -lh out/

      - name: Step 2 - Generate model library (.so)
        env:
          QNN_SDK_ROOT: ${{ steps.find_sdk.outputs.QNN_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ github.workspace }}/android-ndk-r25c
        run: |
          export PATH=$QNN_SDK_ROOT/bin/x86_64-linux-clang:$PATH
          export LD_LIBRARY_PATH=$QNN_SDK_ROOT/lib/x86_64-linux-clang:$LD_LIBRARY_PATH
          mkdir -p out/lib
          qnn-model-lib-generator \
            -c out/mobileclip_model.cpp \
            -b out/mobileclip_model.bin \
            -o out/lib \
            --target aarch64-android
          echo "=== so 产物 ==="
          ls -lh out/lib/
          file out/lib/*.so || true

      - name: Step 3 - Generate context binary (v68)
        env:
          QNN_SDK_ROOT: ${{ steps.find_sdk.outputs.QNN_SDK_ROOT }}
        run: |
          export PATH=$QNN_SDK_ROOT/bin/x86_64-linux-clang:$PATH
          export LD_LIBRARY_PATH=$QNN_SDK_ROOT/lib/x86_64-linux-clang:$LD_LIBRARY_PATH
          SO_FILE=$(ls out/lib/lib*.so | head -1)
          mkdir -p out/context
          qnn-context-binary-generator \
            --backend $QNN_SDK_ROOT/lib/x86_64-linux-clang/libQnnHtp.so \
            --model "$SO_FILE" \
            --output_dir out/context \
            --binary_file mobileclip_fp16_v68.bin
          echo "=== context binary 产物 ==="
          ls -lh out/context/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobileclip-qnn-fp16-v68
          path: |
            out/context/**/*.bin
            out/lib/**/*.so
          if-no-files-found: warn
