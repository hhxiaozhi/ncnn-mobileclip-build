name: Compile MobileCLIP to QNN (Local QAIRT fp16)

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download QAIRT SDK 2.31
        run: |
          wget -q --show-progress https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/2.31.0.250130/v2.31.0.250130.zip
          unzip -q v2.31.0.250130.zip -d qairt
          ls qairt/
          ls qairt/qairt/2.31.0.250130/ 2>/dev/null || ls qairt/2.31.0.250130/ 2>/dev/null || true

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          ls -d android-ndk-r25c

      - name: Download ONNX Model
        run: |
          wget -q https://github.com/hhxiaozhi/ncnn-mobileclip-build/releases/download/v1.0-model/mobileclip_image.onnx
          ls -lh mobileclip_image.onnx

      - name: Locate QNN SDK root
        id: find_sdk
        run: |
          # 尝试两种可能的目录结构
          if [ -d "qairt/2.31.0.250130" ]; then
            echo "QNN_SDK_ROOT=$(pwd)/qairt/2.31.0.250130" >> $GITHUB_OUTPUT
          elif [ -d "qairt/qairt/2.31.0.250130" ]; then
            echo "QNN_SDK_ROOT=$(pwd)/qairt/qairt/2.31.0.250130" >> $GITHUB_OUTPUT
          else
            echo "找不到 SDK 目录，列出 qairt 内容："
            find qairt -maxdepth 3 -type d | head -20
            exit 1
          fi

      - name: Step 1 - ONNX to C++ (fp16)
        env:
          QNN_SDK_ROOT: ${{ steps.find_sdk.outputs.QNN_SDK_ROOT }}
        run: |
          export PATH=$QNN_SDK_ROOT/bin/x86_64-linux-clang:$PATH
          export LD_LIBRARY_PATH=$QNN_SDK_ROOT/lib/x86_64-linux-clang:$LD_LIBRARY_PATH
          mkdir -p out
          # fp16 转换（不需要校准数据）
          qnn-onnx-converter \
            --input_network mobileclip_image.onnx \
            --input_dim pixel_values 1,3,224,224 \
            --float_bitwidth 16 \
            --output_path out/mobileclip_model.cpp
          echo "=== 转换产物 ==="
          ls -lh out/
          # 检查生成的 cpp
          head -100 out/mobileclip_model.cpp || true

      - name: Step 2 - Generate model library (.so) for aarch64-android
        env:
          QNN_SDK_ROOT: ${{ steps.find_sdk.outputs.QNN_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ github.workspace }}/android-ndk-r25c
        run: |
          export PATH=$QNN_SDK_ROOT/bin/x86_64-linux-clang:$PATH
          export LD_LIBRARY_PATH=$QNN_SDK_ROOT/lib/x86_64-linux-clang:$LD_LIBRARY_PATH
          mkdir -p out/lib
          # 找生成的 bin（权重文件）
          BIN_FILE=""
          for f in out/mobileclip_model.cpp out/mobileclip_model.bin; do
            if [ -f "$f" ]; then BIN_FILE="$f"; fi
          done
          echo "输入: cpp=out/mobileclip_model.cpp, bin=$BIN_FILE"
          qnn-model-lib-generator \
            -c out/mobileclip_model.cpp \
            -b out/mobileclip_model.bin \
            -o out/lib \
            --target aarch64-android
          echo "=== so 产物 ==="
          ls -lh out/lib/
          file out/lib/*.so || true

      - name: Step 3 - Generate context binary (arch v68)
        env:
          QNN_SDK_ROOT: ${{ steps.find_sdk.outputs.QNN_SDK_ROOT }}
        run: |
          export PATH=$QNN_SDK_ROOT/bin/x86_64-linux-clang:$PATH
          export LD_LIBRARY_PATH=$QNN_SDK_ROOT/lib/x86_64-linux-clang:$LD_LIBRARY_PATH
          SO_FILE=$(ls out/lib/lib*.so | head -1)
          echo "输入 so: $SO_FILE"
          qnn-context-binary-generator \
            --backend $QNN_SDK_ROOT/lib/x86_64-linux-clang/libQnnHtp.so \
            --model "$SO_FILE" \
            --output_dir out/context \
            --binary_file mobileclip_fp16_v68.bin \
            --config_file $QNN_SDK_ROOT/examples/Models/context_binary_generator_configs/htp_config.json 2>&1 || \
          qnn-context-binary-generator \
            --backend $QNN_SDK_ROOT/lib/x86_64-linux-clang/libQnnHtp.so \
            --model "$SO_FILE" \
            --output_dir out/context \
            --binary_file mobileclip_fp16_v68.bin
          echo "=== context binary 产物 ==="
          ls -lh out/context/ 2>/dev/null || ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobileclip-qnn-fp16-v68
          path: |
            out/**/*.bin
            out/**/*.so
          if-no-files-found: warn
