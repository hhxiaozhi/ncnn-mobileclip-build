name: Compile SigLIP2 So400M to QNN (fp16, HTP v68, P0 tuned)

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install QAIRT Python deps
        run: |
          python -m pip install --upgrade pip
          pip install \
            "numpy<2.0" "onnx==1.14.1" "protobuf>=3.20,<4.0" "packaging>=20,<24" \
            pyyaml pillow pandas matplotlib scipy tqdm attrs six networkx sympy \
            "scikit-learn<1.6" opencv-python-headless onnxruntime

      - name: Download QAIRT SDK 2.31
        run: |
          wget -q "https://softwarecenter.qualcomm.com/api/download/software/qualcomm_neural_processing_sdk/v2.31.0.250130.zip" -O qairt.zip
          unzip -q qairt.zip -d qairt_extracted
          echo "QNN_SDK_ROOT=$(pwd)/qairt_extracted/qairt/2.31.0.250130" >> $GITHUB_ENV

      - name: Download SigLIP2 So400M fp16 ONNX from HuggingFace
        run: |
          wget -q --show-progress -O siglip2_so400m_fp16.onnx \
            'https://huggingface.co/onnx-community/siglip2-so400m-patch14-384-ONNX/resolve/main/onnx/vision_model_fp16.onnx'
          ls -lh siglip2_so400m_fp16.onnx

      - name: Step 1 - ONNX to C++ (fp16)
        run: |
          set -o pipefail
          source $QNN_SDK_ROOT/bin/envsetup.sh
          mkdir -p out
          qnn-onnx-converter \
            --input_network siglip2_so400m_fp16.onnx \
            --input_dim pixel_values 1,3,384,384 \
            --float_bitwidth 16 \
            --output_path out/siglip2_model.cpp \
            2>&1 | tee out/step1_convert.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -ne 0 ]; then exit 1; fi

      - name: Step 2 - Generate x86_64 .so
        run: |
          set -o pipefail
          source $QNN_SDK_ROOT/bin/envsetup.sh
          mkdir -p out/lib_x86
          qnn-model-lib-generator \
            -c out/siglip2_model.cpp \
            -b out/siglip2_model.bin \
            -o out/lib_x86 \
            -t x86_64-linux-clang \
            2>&1 | tee out/step2_lib.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -ne 0 ]; then exit 1; fi
          echo "=== x86_64 so ==="
          find out/lib_x86 -type f

      - name: Step 3 - Generate context binary (v68, P0 tuned)
        run: |
          set -eo pipefail
          export PYTHONPATH="${PYTHONPATH:-}"
          source "$QNN_SDK_ROOT/bin/envsetup.sh"

          HOST_LIB="$QNN_SDK_ROOT/lib/x86_64-linux-clang"
          HTP_BACKEND="$HOST_LIB/libQnnHtp.so"
          HTP_EXT="$HOST_LIB/libQnnHtpNetRunExtensions.so"

          test -f "$HTP_BACKEND" || { echo "HTP_BACKEND_NOT_FOUND: $HTP_BACKEND"; exit 1; }
          test -f "$HTP_EXT" || { echo "HTP_EXTENSION_NOT_FOUND: $HTP_EXT"; find "$QNN_SDK_ROOT/lib" -name 'libQnnHtpNetRunExtensions.so' -print; exit 1; }

          SO_FILE=$(find out/lib_x86 -name 'lib*.so' -type f -print -quit)
          test -n "$SO_FILE" || { echo "MODEL_LIBRARY_NOT_FOUND"; exit 1; }
          echo "Model library: $SO_FILE"
          ls -lh "$SO_FILE"

          mkdir -p out/context
          CTX_DIR="$(pwd)/out/context"

          cat > out/htp_sm8350_v68.conf <<'HTPCONFIG'
          {
            "graphs": [
              {
                "vtcm_mb": 8,
                "O": 3,
                "graph_names": ["siglip2_model"]
              }
            ],
            "devices": [
              {
                "soc_model": 30,
                "dsp_arch": "v68",
                "device_id": 0,
                "pd_session": "unsigned"
              }
            ]
          }
          HTPCONFIG

          cat > out/htp_backend_extensions.json <<HTPWRAPPER
          {
            "backend_extensions": {
              "shared_library_path": "$HTP_EXT",
              "config_file_path": "$CTX_DIR/../htp_sm8350_v68.conf"
            }
          }
          HTPWRAPPER

          echo "=== HTP target config ==="
          cat out/htp_sm8350_v68.conf
          echo "=== HTP extension wrapper ==="
          cat out/htp_backend_extensions.json

          qnn-context-binary-generator \
            --backend "$HTP_BACKEND" \
            --model "$SO_FILE" \
            --config_file out/htp_backend_extensions.json \
            --output_dir "$CTX_DIR" \
            --binary_file siglip2_so400m_fp16_v68 \
            2>&1 | tee out/step3_context.log

          CTX_FILE="$CTX_DIR/siglip2_so400m_fp16_v68.bin"
          test -s "$CTX_FILE" || { echo "CONTEXT_BINARY_MISSING_OR_EMPTY"; exit 1; }
          echo "CONTEXT_BINARY_SIZE=$(stat -c %s "$CTX_FILE")"
          sha256sum "$CTX_FILE"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siglip2-so400m-fp16-v68-p0
          path: |
            out/**/*.bin
            out/**/*.so
            out/**/*.json
            out/**/*.conf
            out/*.log
            out/siglip2_model.*
          if-no-files-found: warn
