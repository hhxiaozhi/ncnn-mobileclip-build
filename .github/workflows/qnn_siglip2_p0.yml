1: name: Compile SigLIP2 So400M to QNN (fp16, HTP v68, P0 tuned)
2: 
3: on:
4:   workflow_dispatch:
5: 
6: jobs:
7:   compile:
8:     runs-on: ubuntu-22.04
9:     timeout-minutes: 300
10:     steps:
11:       - uses: actions/checkout@v4
12: 
13:       - uses: actions/setup-python@v5
14:         with:
15:           python-version: "3.10"
16: 
17:       - name: Install QAIRT Python deps
18:         run: |
19:           python -m pip install --upgrade pip
20:           pip install \
21:             "numpy<2.0" "onnx==1.14.1" "protobuf>=3.20,<4.0" "packaging>=20,<24" \
22:             pyyaml pillow pandas matplotlib scipy tqdm attrs six networkx sympy \
23:             "scikit-learn<1.6" opencv-python-headless onnxruntime
24: 
25:       - name: Download QAIRT SDK 2.31
26:         run: |
27:           wget -q "https://softwarecenter.qualcomm.com/api/download/software/qualcomm_neural_processing_sdk/v2.31.0.250130.zip" -O qairt.zip
28:           unzip -q qairt.zip -d qairt_extracted
29:           echo "QNN_SDK_ROOT=$(pwd)/qairt_extracted/qairt/2.31.0.250130" >> $GITHUB_ENV
30: 
31:       - name: Download SigLIP2 So400M fp16 ONNX from HuggingFace
32:         run: |
33:           wget -q --show-progress -O siglip2_so400m_fp16.onnx \
34:             'https://huggingface.co/onnx-community/siglip2-so400m-patch14-384-ONNX/resolve/main/onnx/vision_model_fp16.onnx'
35:           ls -lh siglip2_so400m_fp16.onnx
36: 
37:       - name: Step 1 - ONNX to C++ (fp16)
38:         run: |
39:           set -o pipefail
40:           source $QNN_SDK_ROOT/bin/envsetup.sh
41:           mkdir -p out
42:           qnn-onnx-converter \
43:             --input_network siglip2_so400m_fp16.onnx \
44:             --input_dim pixel_values 1,3,384,384 \
45:             --float_bitwidth 16 \
46:             --output_path out/siglip2_model.cpp \
47:             2>&1 | tee out/step1_convert.log
48:           EXIT_CODE=${PIPESTATUS[0]}
49:           if [ "$EXIT_CODE" -ne 0 ]; then exit 1; fi
50: 
51:       - name: Step 2 - Generate x86_64 .so
52:         run: |
53:           set -o pipefail
54:           source $QNN_SDK_ROOT/bin/envsetup.sh
55:           mkdir -p out/lib_x86
56:           qnn-model-lib-generator \
57:             -c out/siglip2_model.cpp \
58:             -b out/siglip2_model.bin \
59:             -o out/lib_x86 \
60:             -t x86_64-linux-clang \
61:             2>&1 | tee out/step2_lib.log
62:           EXIT_CODE=${PIPESTATUS[0]}
63:           if [ "$EXIT_CODE" -ne 0 ]; then exit 1; fi
64:           echo "=== x86_64 so ==="
65:           find out/lib_x86 -type f
66: 
67:       - name: Step 3 - Generate context binary (v68, P0 tuned)
68:         run: |
69:           set -euo pipefail
70:           source "$QNN_SDK_ROOT/bin/envsetup.sh"
71: 
72:           HOST_LIB="$QNN_SDK_ROOT/lib/x86_64-linux-clang"
73:           HTP_BACKEND="$HOST_LIB/libQnnHtp.so"
74:           HTP_EXT="$HOST_LIB/libQnnHtpNetRunExtensions.so"
75: 
76:           test -f "$HTP_BACKEND" || { echo "HTP_BACKEND_NOT_FOUND: $HTP_BACKEND"; exit 1; }
77:           test -f "$HTP_EXT" || { echo "HTP_EXTENSION_NOT_FOUND: $HTP_EXT"; find "$QNN_SDK_ROOT/lib" -name 'libQnnHtpNetRunExtensions.so' -print; exit 1; }
78: 
79:           SO_FILE=$(find out/lib_x86 -name 'lib*.so' -type f -print -quit)
80:           test -n "$SO_FILE" || { echo "MODEL_LIBRARY_NOT_FOUND"; exit 1; }
81:           echo "Model library: $SO_FILE"
82:           ls -lh "$SO_FILE"
83:           file "$SO_FILE"
84: 
85:           mkdir -p out/context
86:           CTX_DIR="$(pwd)/out/context"
87: 
88:           # P0 tuned: vtcm_mb=8 + O=3 (graph_finalization_optimization_mode)
89:           cat > out/htp_sm8350_v68.conf <<'HTPCONFIG'
90:           {
91:             "graphs": [
92:               {
93:                 "vtcm_mb": 8,
94:                 "O": 3,
95:                 "graph_names": ["siglip2_model"]
96:               }
97:             ],
98:             "devices": [
99:               {
100:                 "soc_model": 30,
101:                 "dsp_arch": "v68",
102:                 "device_id": 0,
103:                 "pd_session": "unsigned"
104:               }
105:             ]
106:           }
107:           HTPCONFIG
108: 
109:           cat > out/htp_backend_extensions.json <<HTPWRAPPER
110:           {
111:             "backend_extensions": {
112:               "shared_library_path": "$HTP_EXT",
113:               "config_file_path": "$CTX_DIR/../htp_sm8350_v68.conf"
114:             }
115:           }
116:           HTPWRAPPER
117: 
118:           echo "=== HTP target config ==="
119:           cat out/htp_sm8350_v68.conf
120:           echo "=== HTP extension wrapper ==="
121:           cat out/htp_backend_extensions.json
122: 
123:           qnn-context-binary-generator \
124:             --backend "$HTP_BACKEND" \
125:             --model "$SO_FILE" \
126:             --config_file out/htp_backend_extensions.json \
127:             --output_dir "$CTX_DIR" \
128:             --binary_file siglip2_so400m_fp16_v68 \
129:             2>&1 | tee out/step3_context.log
130: 
131:           CTX_FILE="$CTX_DIR/siglip2_so400m_fp16_v68.bin"
132:           test -s "$CTX_FILE" || { echo "CONTEXT_BINARY_MISSING_OR_EMPTY"; exit 1; }
133:           echo "CONTEXT_BINARY_SIZE=$(stat -c %s "$CTX_FILE")"
134:           sha256sum "$CTX_FILE"
135: 
136:       - name: Upload artifacts
137:         if: always()
138:         uses: actions/upload-artifact@v4
139:         with:
140:           name: siglip2-so400m-fp16-v68-p0
141:           path: |
142:             out/**/*.bin
143:             out/**/*.so
144:             out/**/*.json
145:             out/**/*.conf
146:             out/*.log
147:             out/siglip2_model.*
148:           if-no-files-found: warn
