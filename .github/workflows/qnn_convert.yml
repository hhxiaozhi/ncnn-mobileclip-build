
name: Compile MobileCLIP ONNX to QNN

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Deps
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: onnx onnxscript
          pip install qai-hub
      - name: Download Model
        run: |
          # 从之前创建的 Release 下载真实模型
          wget -q https://github.com/hhxiaozhi/ncnn-mobileclip-build/releases/download/v1.0-model/mobileclip_image.onnx
          ls -lh mobileclip_image.onnx
      - name: Configure qai-hub
        env:
          QAI_HUB_API_TOKEN: ${{ secrets.QAI_HUB_API_TOKEN }}
        run: |
          qai-hub configure --api_token $QAI_HUB_API_TOKEN
      - name: Submit Compile Job
        run: |
          cat > compile.py <<'PYEOF'
          import qai_hub as hub

          device = hub.Device("Samsung Galaxy S23 (Family)")

          compile_job = hub.submit_compile_job(
              model="mobileclip_image.onnx",
              device=device,
              input_specs={"pixel_values": (1, 3, 224, 224)},
              options="--target_runtime precompiled_qnn_onnx --quantize_full_type float16 --truncate_64bit_io",
              name="mobileclip_image compile",
          )
          print(f"Submitted compile job: {compile_job.job_id}")

          compile_job.wait()
          status = compile_job.get_status()
          print(f"Final status: {status}")

          if status != "SUCCESS":
              print(f"Compile failed. Check job {compile_job.job_id} in the AI Hub dashboard.", file=sys.stderr)
              sys.exit(1)

          compile_job.download_target_model("mobileclip_qnn.bin")
          print("Downloaded successfully")
          PYEOF
          python compile.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobileclip-qnn
          path: "*.zip"
          if-no-files-found: error
