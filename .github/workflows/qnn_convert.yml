
name: Compile MobileCLIP to QNN Context Binary

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Deps
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: onnx onnxscript
          pip install --upgrade qai-hub
      - name: Download Model
        run: |
          wget -q https://github.com/hhxiaozhi/ncnn-mobileclip-build/releases/download/v1.0-model/mobileclip_image.onnx
          ls -lh mobileclip_image.onnx
      - name: Configure qai-hub
        env:
          QAI_HUB_API_TOKEN: ${{ secrets.QAI_HUB_API_TOKEN }}
        run: |
          qai-hub configure --api_token $QAI_HUB_API_TOKEN
      - name: Submit Compile and Link Jobs
        run: |
          cat > compile_link.py <<'PYEOF'
          import qai_hub as hub
          import sys
          import traceback

          # 换成 SM8350 (骁龙 888) 的设备族
          device = hub.Device("Samsung Galaxy S21 (Family)")

          print("Submitting compile job...")
          compile_job = hub.submit_compile_job(
              model="mobileclip_image.onnx",
              device=device,
              input_specs={"pixel_values": (1, 3, 224, 224)},
              options="--target_runtime qnn_dlc --truncate_64bit_io",
              name="mobileclip compile",
          )
          compile_job.wait()
          print(f"Compile status: {compile_job.get_status()}")

          if compile_job.get_status() != "SUCCESS":
              sys.exit(1)

          print("Submitting link job...")
          try:
              # 第一个参数改成 models，传一个列表；options 留空
              link_job = hub.submit_link_job(
                  models=[compile_job.get_target_model()],
                  device=device,
                  options="",
                  name="mobileclip link",
              )
              link_job.wait()
              print(f"Link status: {link_job.get_status()}")
              if link_job.get_status() != "SUCCESS":
                  sys.exit(1)
              print("Downloading context binary...")
              link_job.download_target_model("mobileclip_qnn.bin")
              print("Downloaded successfully")
          except Exception:
              traceback.print_exc()
              sys.exit(1)
          PYEOF
          python compile_link.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobileclip-qnn
          path: mobileclip_qnn.bin
          if-no-files-found: error
