
name: Test AI Hub Compile with MobileNetV2

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Deps
        run: |
          pip install torch torchvision onnx "qai-hub[onnx]"
      - name: Export MobileNetV2 ONNX
        run: |
          python -c "
          import torch, torchvision
          model = torchvision.models.mobilenet_v2(pretrained=True).eval()
          dummy = torch.randn(1, 3, 224, 224)
          torch.onnx.export(model, dummy, 'mobilenet_v2.onnx', opset_version=13, input_names=['input'])
          print('Exported mobilenet_v2.onnx')
          "
      - name: Configure qai-hub
        env:
          QAI_HUB_API_TOKEN: ${{ secrets.QAI_HUB_API_TOKEN }}
        run: |
          qai-hub configure --api_token $QAI_HUB_API_TOKEN
      - name: Submit Compile Job
        run: |
          cat > compile.py <<'PYEOF'
          import qai_hub as hub

          device = hub.Device("Samsung Galaxy S23 (Family)")

          compile_job = hub.submit_compile_job(
              model="mobilenet_v2.onnx",
              device=device,
              input_specs={"input": (1, 3, 224, 224)},
              options="--target_runtime qnn_context_binary --quantize_full_type float16 --qairt_version latest",
              name="mobilenet_v2 test",
          )
          print(f"Submitted compile job: {compile_job.job_id}")

          compile_job.wait()
          status = compile_job.get_status()
          print(f"Final status: {status}")

          if status != hub.JobStatus.SUCCESS:
              print(f"Compile failed. Check job {compile_job.job_id} in the AI Hub dashboard.", file=sys.stderr)
              sys.exit(1)

          compile_job.download_target_model("mobilenet_v2.bin")
          print("Downloaded mobilenet_v2.bin")
          PYEOF
          python compile.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobilenet-v2-qnn
          path: mobilenet_v2.bin
          if-no-files-found: error
