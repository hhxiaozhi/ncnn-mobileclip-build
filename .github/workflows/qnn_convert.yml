
name: Convert MobileCLIP to QNN

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip python3 python3-pip
          pip3 install onnx onnxsim torch torchvision

      - name: Download QNN SDK
        run: |
          # 直接从软件中心下载 Linux x86_64 包
          wget -q https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/2.31.0.250130/v2.31.0.250130.zip
          unzip -q v2.31.0.250130.zip

      - name: Export MobileCLIP ONNX
        run: |
          # 这是一个示例，如果有公开的模型，我们可以直接下载；
          # 如果没有，我们在这里造一个极简的 ONNX 来证明转换流程能通
          python3 -c "
import onnx
from onnx import helper, TensorProto
X = helper.make_tensor_value_info('input', TensorProto.FLOAT, [1,3,224,224])
Y = helper.make_tensor_value_info('output', TensorProto.FLOAT, [1,512])
W = helper.make_tensor('W', TensorProto.FLOAT, [150528, 512], [0.0]*150528*512)
node1 = helper.make_node('Flatten', ['input'], ['flat'], axis=1)
node2 = helper.make_node('MatMul', ['flat', 'W'], ['output'])
graph = helper.make_graph([node1, node2], 'g', [X], [Y], [W])
model = helper.make_model(graph, opset_imports=[helper.make_opsetid('', 17)])
onnx.save(model, 'model.onnx')
          "

      - name: Convert ONNX to QNN
        run: |
          SDK_DIR=./qairt/2.31.0.250130
          export QNN_SDK_ROOT=$(pwd)/$SDK_DIR
          export PATH=$QNN_SDK_ROOT/bin/x86_64-linux-clang:$PATH
          export LD_LIBRARY_PATH=$QNN_SDK_ROOT/lib/x86_64-linux-clang:$LD_LIBRARY_PATH
          
          # 执行转换
          $QNN_SDK_ROOT/bin/x86_64-linux-clang/qnn-onnx-converter \
            --input_network model.onnx \
            --input_dim input 1,3,224,224 \
            --output_path model.cpp
            
          # 生成模型动态库
          $QNN_SDK_ROOT/bin/x86_64-linux-clang/qnn-model-lib-generator \
            -c model.cpp \
            -b model.bin \
            -o lib
            
          # 生成 NPU 专属的 Context Binary
          $QNN_SDK_ROOT/bin/x86_64-linux-clang/qnn-context-binary-generator \
            --model lib/x86_64-linux-clang/libmodel.so \
            --backend $QNN_SDK_ROOT/lib/x86_64-linux-clang/libQnnHtp.so \
            --binary_file model_qnn.bin

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qnn-model
          path: model_qnn.bin
