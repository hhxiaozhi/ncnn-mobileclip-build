
name: QNN Convert via AI Hub

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Model
        run: |
          wget -q https://github.com/hhxiaozhi/ncnn-mobileclip-build/releases/download/v1.0-model/mobileclip_image.onnx
          ls -la *.onnx

      - name: Install Python Deps
        run: |
          pip3 install onnx qai-hub

      - name: Submit to AI Hub
        env:
          QAI_HUB_API_TOKEN: ${{ secrets.QAI_HUB_API_TOKEN }}
        run: |
          python3 -c "
import qai_hub as hub
import os
print('Uploading model...')
job = hub.submit_compile_job(
    model='mobileclip_image.onnx',
    device=hub.Device('Snapdragon 888'),
    options='--target_runtime qnn_context_binary'
)
job.wait()
print('Downloading compiled model...')
job.download_target_model('model_qnn.bin')
print('Done')
          "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qnn-binary
          path: model_qnn.bin
