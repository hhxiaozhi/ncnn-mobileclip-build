
name: Compile MobileCLIP to QNN Context Binary

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Deps
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: onnx onnxscript numpy
          pip install --upgrade qai-hub
      - name: Download Model
        run: |
          wget -q https://github.com/hhxiaozhi/ncnn-mobileclip-build/releases/download/v1.0-model/mobileclip_image.onnx
          ls -lh mobileclip_image.onnx
      - name: Configure qai-hub
        env:
          QAI_HUB_API_TOKEN: ${{ secrets.QAI_HUB_API_TOKEN }}
        run: |
          qai-hub configure --api_token $QAI_HUB_API_TOKEN
      - name: Compile (fp32 -> qnn_dlc + float16 + quantize_io)
        run: |
          cat > step1_compile.py <<'PYEOF'
          import sys, traceback
          import qai_hub as hub

          device = hub.Device("Samsung Galaxy S21 (Family)")
          try:
              model = hub.upload_model("mobileclip_image.onnx")
              print(f"model uploaded: {model}", flush=True)
              job = hub.submit_compile_job(
                  model=model,
                  device=device,
                  input_specs={"pixel_values": (1,3,224,224)},
                  options="--target_runtime qnn_dlc --quantize_full_type float16 --quantize_io --truncate_64bit_io",
                  name="mobileclip compile fp16 io",
              )
              print(f"submitted: {job.job_id}", flush=True)
              job.wait()
              st = job.get_status()
              print(f"compile status: {st}", flush=True)
              if st != "SUCCESS":
                  sys.exit(1)
              job.download_target_model("compiled_model.zip")
              print("downloaded compiled_model.zip", flush=True)
          except Exception:
              traceback.print_exc()
              sys.exit(1)
          PYEOF
          python step1_compile.py
      - name: Upload compiled model
        uses: actions/upload-artifact@v4
        with:
          name: compiled_model
          path: compiled_model.zip
          if-no-files-found: error
