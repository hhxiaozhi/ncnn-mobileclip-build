
name: Compile MobileCLIP to QNN Context Binary

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Deps
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: onnx onnxscript numpy
          pip install --upgrade qai-hub
      - name: Download Model
        run: |
          wget -q https://github.com/hhxiaozhi/ncnn-mobileclip-build/releases/download/v1.0-model/mobileclip_image.onnx
          ls -lh mobileclip_image.onnx
      - name: Configure qai-hub
        env:
          QAI_HUB_API_TOKEN: ${{ secrets.QAI_HUB_API_TOKEN }}
        run: |
          qai-hub configure --api_token $QAI_HUB_API_TOKEN
      - name: Inspect API
        run: |
          python -c "
          import qai_hub, inspect
          print('version:', qai_hub.__version__)
          print('has submit_quantize_job:', hasattr(qai_hub, 'submit_quantize_job'))
          print('has Client:', hasattr(qai_hub, 'Client'))
          print('has submit_compile_job:', hasattr(qai_hub, 'submit_compile_job'))
          if hasattr(qai_hub, 'submit_quantize_job'):
              print('quantize sig:', inspect.signature(qai_hub.submit_quantize_job))
          "
      - name: Try quantize+compile+link
        run: |
          cat > run.py <<'PYEOF'
          import sys, traceback
          import numpy as np
          import qai_hub as hub
          from qai_hub import QuantizeDtype

          def main() -> int:
              device = hub.Device("Samsung Galaxy S21 (Family)")
              try:
                  # 1. 上传模型
                  model = hub.upload_model("mobileclip_image.onnx")
                  print(f"model uploaded: {model}")

                  # 2. 生成 100 张随机校准数据（float32, (1,3,224,224)）
                  calib = {"pixel_values": [np.random.rand(1,3,224,224).astype(np.float32) for _ in range(100)]}
                  calib_ds = hub.upload_dataset(calib)
                  print(f"calib uploaded: {calib_ds}")

                  # 3. 量化
                  quant_job = hub.submit_quantize_job(
                      model=model,
                      calibration_data=calib_ds,
                      weights_dtype=QuantizeDtype.INT8,
                      activations_dtype=QuantizeDtype.INT8,
                      name="mobileclip int8",
                  )
                  quant_job.wait()
                  print(f"quant status: {quant_job.get_status()}")
                  if quant_job.get_status() != "SUCCESS":
                      return 1
                  quant_model = quant_job.get_target_model()
                  print(f"quant model: {quant_model}")

                  # 4. 编译 + quantize_io
                  compile_job = hub.submit_compile_job(
                      model=quant_model,
                      device=device,
                      input_specs={"pixel_values": (1,3,224,224)},
                      options="--target_runtime qnn_dlc --quantize_io --truncate_64bit_io",
                      name="mobileclip compile int8",
                  )
                  compile_job.wait()
                  print(f"compile status: {compile_job.get_status()}")
                  if compile_job.get_status() != "SUCCESS":
                      return 1

                  # 5. Link
                  link_job = hub.submit_link_job(
                      models=[compile_job.get_target_model()],
                      device=device,
                      options="",
                      name="mobileclip link",
                  )
                  link_job.wait()
                  print(f"link status: {link_job.get_status()}")
                  if link_job.get_status() != "SUCCESS":
                      return 1

                  link_job.download_target_model("mobileclip_qnn.bin")
                  print("downloaded mobileclip_qnn.bin")
                  return 0
              except Exception:
                  traceback.print_exc()
                  return 1

          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
          python run.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobileclip-qnn
          path: mobileclip_qnn.bin
          if-no-files-found: error
