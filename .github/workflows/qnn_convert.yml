
name: QNN Convert

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Model
        run: |
          wget -q https://github.com/hhxiaozhi/ncnn-mobileclip-build/releases/download/v1.0-model/mobileclip_image.onnx
          ls -la *.onnx

      - name: Download QNN SDK
        run: |
          wget -q https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/2.31.0.250130/v2.31.0.250130.zip
          unzip -q v2.31.0.250130.zip

      - name: Convert
        run: |
          SDK_DIR=./qairt/2.31.0.250130
          export QNN_SDK_ROOT=$(pwd)/$SDK_DIR
          export PATH=$QNN_SDK_ROOT/bin/x86_64-linux-clang:$PATH
          export LD_LIBRARY_PATH=$QNN_SDK_ROOT/lib/x86_64-linux-clang:$LD_LIBRARY_PATH
          $QNN_SDK_ROOT/bin/x86_64-linux-clang/qnn-onnx-converter \
            --input_network mobileclip_image.onnx \
            --input_dim pixel_values 1,3,224,224 \
            --output_path model.cpp
          $QNN_SDK_ROOT/bin/x86_64-linux-clang/qnn-model-lib-generator \
            -c model.cpp -b model.bin -o lib
          $QNN_SDK_ROOT/bin/x86_64-linux-clang/qnn-context-binary-generator \
            --model lib/x86_64-linux-clang/libmodel.so \
            --backend $QNN_SDK_ROOT/lib/x86_64-linux-clang/libQnnHtp.so \
            --binary_file model_qnn.bin

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: qnn-binary
          path: model_qnn.bin
