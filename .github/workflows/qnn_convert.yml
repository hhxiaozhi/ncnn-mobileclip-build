
name: Test AI Hub Compile with MobileNetV2

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Deps
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: torch torchvision onnx onnxscript
          pip install qai-hub
      - name: Export MobileNetV2 ONNX
        run: |
          python -c "
          import torch, torchvision, onnx
          model = torchvision.models.mobilenet_v2(pretrained=True).eval()
          dummy = torch.randn(1, 3, 224, 224)
          torch.onnx.export(model, dummy, 'mobilenet_v2_raw.onnx', opset_version=13, input_names=['input'])
          m = onnx.load('mobilenet_v2_raw.onnx')
          onnx.save(m, 'mobilenet_v2.onnx', save_as_external_data=False)
          print('Exported and inlined mobilenet_v2.onnx')
          "
      - name: Configure qai-hub
        env:
          QAI_HUB_API_TOKEN: ${{ secrets.QAI_HUB_API_TOKEN }}
        run: |
          qai-hub configure --api_token $QAI_HUB_API_TOKEN
      - name: Submit Compile Job
        run: |
          cat > compile.py <<'PYEOF'
          import qai_hub as hub

          device = hub.Device("Samsung Galaxy S23 (Family)")

          compile_job = hub.submit_compile_job(
              model="mobilenet_v2.onnx",
              device=device,
              input_specs={"input": (1, 3, 224, 224)},
              options="--target_runtime precompiled_qnn_onnx --quantize_full_type float16 --truncate_64bit_io",
              name="mobilenet_v2 test v9",
          )
          print(f"Submitted compile job: {compile_job.job_id}")

          compile_job.wait()
          status = compile_job.get_status()
          print(f"Final status: {status}")

          if status != "SUCCESS":
              print(f"Compile failed.", file=sys.stderr)
              sys.exit(1)

          # 下载下来实际是个 zip 包，名字会自动加 .onnx.zip
          compile_job.download_target_model("mobilenet_v2.bin")
          print("Downloaded successfully")
          PYEOF
          python compile.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobilenet-v2-qnn
          # 修改匹配规则，抓取生成的 zip 包
          path: mobilenet_v2.bin.onnx.zip
          if-no-files-found: error
