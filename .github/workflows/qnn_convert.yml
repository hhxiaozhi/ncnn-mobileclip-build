
name: Compile MobileCLIP to QNN Context Binary

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Deps
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: onnx onnxscript
          pip install --upgrade qai-hub
      - name: Download Model
        run: |
          wget -q https://github.com/hhxiaozhi/ncnn-mobileclip-build/releases/download/v1.0-model/mobileclip_image.onnx
          ls -lh mobileclip_image.onnx
      - name: Configure qai-hub
        env:
          QAI_HUB_API_TOKEN: ${{ secrets.QAI_HUB_API_TOKEN }}
        run: |
          qai-hub configure --api_token $QAI_HUB_API_TOKEN
      - name: Inspect API signature
        run: |
          python -c "
          import qai_hub, inspect
          print('qai_hub version:', getattr(qai_hub, '__version__', 'unknown'))
          print('signature:', inspect.signature(qai_hub.submit_compile_and_link_jobs))
          for d in qai_hub.get_devices():
              if 'S21' in d.name:
                  print('DEVICE:', d.name, '->', d.attributes)
          "
      - name: Submit Compile and Link Jobs
        run: |
          cat > compile_link.py <<'PYEOF'
          import sys
          import traceback
          import qai_hub as hub

          def main() -> int:
              device = hub.Device("Samsung Galaxy S21 (Family)")

              try:
                  compile_jobs, link_job = hub.submit_compile_and_link_jobs(
                      models=["mobileclip_image.onnx"],
                      device=device,
                      graph_names=["mobileclip"],  # 关键：传列表时 graph_names 是必须的
                      input_specs={"pixel_values": (1, 3, 224, 224)},
                      compile_options="--truncate_64bit_io",
                      link_options="",
                      name="mobileclip compile+link",
                  )
              except Exception:
                  traceback.print_exc()
                  return 1

              if link_job is None:
                  print("link_job is None, compile may have failed")
                  return 1

              link_job.wait()
              status = link_job.get_status()
              print(f"link job status: {status}")

              if status != "SUCCESS":
                  return 1

              link_job.download_target_model("mobileclip_qnn.bin")
              print("downloaded mobileclip_qnn.bin")
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
          python compile_link.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobileclip-qnn
          path: mobileclip_qnn.bin
          if-no-files-found: error
