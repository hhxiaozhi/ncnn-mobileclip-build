
name: Compile MobileCLIP to QNN Context Binary

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Deps
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: onnx onnxscript numpy
          pip install --upgrade qai-hub
      - name: Download Model
        run: |
          wget -q https://github.com/hhxiaozhi/ncnn-mobileclip-build/releases/download/v1.0-model/mobileclip_image.onnx
          ls -lh mobileclip_image.onnx
      - name: Configure qai-hub
        env:
          QAI_HUB_API_TOKEN: ${{ secrets.QAI_HUB_API_TOKEN }}
        run: |
          qai-hub configure --api_token $QAI_HUB_API_TOKEN
      - name: Quantize + Compile + Link
        run: |
          cat > run.py <<'PYEOF'
          import sys, traceback
          import numpy as np
          import qai_hub as hub

          device = hub.Device("Samsung Galaxy S21 (Family)")
          try:
              model = hub.upload_model("mobileclip_image.onnx")
              print(f"model uploaded: {model}", flush=True)

              calib = {"pixel_values": [np.random.rand(1,3,224,224).astype(np.float32) for _ in range(100)]}
              calib_ds = hub.upload_dataset(calib)
              print(f"calib uploaded: {calib_ds}", flush=True)

              quant_job = hub.submit_quantize_job(
                  model=model,
                  calibration_data=calib_ds,
                  weights_dtype=hub.QuantizeDtype.INT8,
                  activations_dtype=hub.QuantizeDtype.INT8,
                  name="mobileclip quantize w8a8",
              )
              print(f"quant job: {quant_job.job_id}", flush=True)
              quant_job.wait()
              st = quant_job.get_status()
              print(f"quant status: {st}", flush=True)
              if st != "SUCCESS":
                  sys.exit(1)
              quant_model = quant_job.get_target_model()

              # 关键：compile 阶段强制 UINT8
              compile_job = hub.submit_compile_job(
                  model=quant_model,
                  device=device,
                  input_specs={"pixel_values": (1,3,224,224)},
                  options="--target_runtime qnn_dlc --quantize_io --truncate_64bit_io --qnn_options default_graph_htp_precision=UINT8",
                  name="mobileclip compile uint8 forced",
              )
              print(f"compile job: {compile_job.job_id}", flush=True)
              compile_job.wait()
              st = compile_job.get_status()
              print(f"compile status: {st}", flush=True)
              if st != "SUCCESS":
                  sys.exit(1)

              # link 阶段也强制 UINT8
              link_job = hub.submit_link_job(
                  models=[compile_job.get_target_model()],
                  device=device,
                  options="--qnn_options default_graph_htp_precision=UINT8",
                  name="mobileclip link uint8 forced",
              )
              print(f"link job: {link_job.job_id}", flush=True)
              link_job.wait()
              st = link_job.get_status()
              print(f"link status: {st}", flush=True)
              if st != "SUCCESS":
                  sys.exit(1)

              link_job.download_target_model("mobileclip_qnn.bin")
              print("downloaded mobileclip_qnn.bin", flush=True)
          except Exception:
              traceback.print_exc()
              sys.exit(1)
          PYEOF
          python run.py
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mobileclip-qnn
          path: "*.bin"
          if-no-files-found: error
