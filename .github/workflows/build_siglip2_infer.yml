name: Build SigLIP2 QNN infer binary (aarch64 bionic)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update -y && sudo apt-get install -y wget unzip

      - name: Download QAIRT SDK 2.31
        run: |
          wget -q "https://softwarecenter.qualcomm.com/api/download/software/qualcomm_neural_processing_sdk/v2.31.0.250130.zip" -O qairt.zip
          unzip -q qairt.zip -d qairt_extracted
          ROOT=$(find qairt_extracted -maxdepth 3 -type d -name 'include' -printf '%h\n' | head -1)
          echo "QNN_SDK_ROOT=$ROOT" >> $GITHUB_ENV
          echo "=== QnnSystemContext.h ==="
          cat $ROOT/include/QNN/System/QnnSystemContext.h
          echo "=== QnnSystemInterface.h (first 120) ==="
          sed -n '1,120p' $ROOT/include/QNN/System/QnnSystemInterface.h

      - name: Setup NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip

      - name: Cross-compile (expect fail, we only want header dump)
        run: |
          CLANG=$(pwd)/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          $CLANG -O2 -o siglip2_infer siglip2_infer.c -I$QNN_SDK_ROOT/include/QNN -I$QNN_SDK_ROOT/include/QNN/System -ldl -llog 2>&1 | head -80 || true
