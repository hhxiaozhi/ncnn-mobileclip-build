name: Compile MobileCLIP to QNN (v8 - full deps + fail fast)

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install full converter deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy onnx pyyaml protobuf packaging pillow
          echo "=== 验证 import ==="
          python -c "import numpy, onnx, yaml, packaging; print('all imports OK')" 2>&1

      - name: Download QAIRT SDK 2.31
        run: |
          QAIRT_VERSION="2.31.0.250130"
          URL="https://softwarecenter.qualcomm.com/api/download/software/qualcomm_neural_processing_sdk/v${QAIRT_VERSION}.zip"
          wget -q "$URL" -O qairt.zip
          unzip -q qairt.zip -d qairt_extracted
          echo "QNN_SDK_ROOT=$(pwd)/qairt_extracted/qairt/2.31.0.250130" >> $GITHUB_ENV

      - name: Download ONNX Model
        run: |
          wget -q https://github.com/hhxiaozhi/ncnn-mobileclip-build/releases/download/v1.0-model/mobileclip_image.onnx
          ls -lh mobileclip_image.onnx

      - name: Step 1 - ONNX to C++ (fp16) - FAIL FAST
        run: |
          set -e
          source $QNN_SDK_ROOT/bin/envsetup.sh
          mkdir -p out
          # 不用 tee，直接输出到 stdout 和文件（用 2>&1 | tee，但 tee 后 echo 退出码）
          qnn-onnx-converter \
            --input_network mobileclip_image.onnx \
            --input_dim pixel_values 1,3,224,224 \
            --act_bias_bitwidth 16 --act_bitwidth 16 \
            --weight_bias_bitwidth 16 --weight_bitwidth 16 \
            --output_path out/mobileclip_model.cpp \
            2>&1 | tee out/step1_convert.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "converter exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "CONVERTER FAILED"
            exit 1
          fi
          ls -lh out/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qnn-v8-result
          path: |
            out/*.log
            out/mobileclip_model.*
          if-no-files-found: warn
