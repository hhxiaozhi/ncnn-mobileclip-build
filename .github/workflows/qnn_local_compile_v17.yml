name: Compile MobileCLIP to QNN (v17 - absolute path for .so)

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ALL QAIRT Python deps
        run: |
          python -m pip install --upgrade pip
          pip install \
            "numpy<2.0" "onnx==1.14.1" "protobuf>=3.20,<4.0" "packaging>=20,<24" \
            pyyaml pillow pandas matplotlib scipy tqdm attrs six networkx sympy \
            "scikit-learn<1.6" opencv-python-headless onnxruntime

      - name: Download QAIRT SDK 2.31
        run: |
          wget -q "https://softwarecenter.qualcomm.com/api/download/software/qualcomm_neural_processing_sdk/v2.31.0.250130.zip" -O qairt.zip
          unzip -q qairt.zip -d qairt_extracted
          echo "QNN_SDK_ROOT=$(pwd)/qairt_extracted/qairt/2.31.0.250130" >> $GITHUB_ENV

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK_ROOT=$(pwd)/android-ndk-r25c" >> $GITHUB_ENV
          echo "$(pwd)/android-ndk-r25c" >> $GITHUB_PATH

      - name: Download ONNX Model
        run: |
          wget -q https://github.com/hhxiaozhi/ncnn-mobileclip-build/releases/download/v1.0-model/mobileclip_image.onnx
          ls -lh mobileclip_image.onnx

      - name: Step 1 - ONNX to C++ (fp16)
        run: |
          set -o pipefail
          source $QNN_SDK_ROOT/bin/envsetup.sh
          mkdir -p out
          qnn-onnx-converter \
            --input_network mobileclip_image.onnx \
            --input_dim pixel_values 1,3,224,224 \
            --float_bitwidth 16 \
            --output_path out/mobileclip_model.cpp \
            2>&1 | tee out/step1_convert.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -ne 0 ]; then exit 1; fi

      - name: Step 2 - Generate model library (.so)
        run: |
          set -o pipefail
          source $QNN_SDK_ROOT/bin/envsetup.sh
          export PATH="$ANDROID_NDK_ROOT:$PATH"
          mkdir -p out/lib
          qnn-model-lib-generator \
            -c out/mobileclip_model.cpp \
            -b out/mobileclip_model.bin \
            -o out/lib \
            -t aarch64-android \
            2>&1 | tee out/step2_lib.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -ne 0 ]; then exit 1; fi

      - name: Step 3 - Generate context binary (v68) - ABSOLUTE PATH
        run: |
          source $QNN_SDK_ROOT/bin/envsetup.sh
          # 用 $(pwd) 拼绝对路径
          SO_FILE="$(pwd)/out/lib/aarch64-android/libmobileclip_model.so"
          echo "so 绝对路径: $SO_FILE"
          ls -lh "$SO_FILE"
          file "$SO_FILE"
          mkdir -p out/context
          CTX_DIR="$(pwd)/out/context"
          # 直接用绝对路径
          qnn-context-binary-generator \
            --backend $QNN_SDK_ROOT/lib/x86_64-linux-clang/libQnnHtp.so \
            --model "$SO_FILE" \
            --output_dir "$CTX_DIR" \
            --binary_file mobileclip_fp16_v68.bin \
            > out/step3_context.log 2>&1
          EXIT_CODE=$?
          echo "exit code: $EXIT_CODE"
          echo "=== step3 日志 ==="
          cat out/step3_context.log
          echo "=== 产物 ==="
          find out/context -type f 2>/dev/null || true
          exit $EXIT_CODE

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qnn-fp16-v68-v17
          path: |
            out/**/*.bin
            out/**/*.so
            out/*.log
            out/mobileclip_model.*
          if-no-files-found: warn
